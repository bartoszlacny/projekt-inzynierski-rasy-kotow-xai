<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rozpoznawanie ze zdjęcia</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rozpoznawanie.css">
</head>
<body>

<header>
    <div class="header_bar">
        <a class="brand" href="index.html">Rozpoznawanie ras kotów</a>

        <button class="menu_button" id="menu_button" aria-expanded="false" aria-controls="menu" aria-label="Otwórz menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="menu">
            <a href="index.html">Strona główna</a>
            <a href="instrukcja.html">Instrukcja obsługi</a>
            <a href="rasy.html">Dostępne rasy</a>
            <a href="rozpoznawanie.html">Rozpoznawanie ze zdjęcia</a>
        </nav>
    </div>
</header>


<main>
  <section class="breed_recognition">
  <h1>Rozpoznawanie ze zdjęcia</h1>
  <p>Wgraj zdjęcie kota i kliknij „Rozpoznaj”, aby zobaczyć wynik.</p>
  </section>
 
  <section class="upload_box">
    <label for="file" class="choose_photo_button">Wybierz zdjęcie</label>
    <input type="file" id="file" accept="image/*" class="hidden">
    <p id="filename_text">Nie wybrano pliku</p>
    <img id="preview" class="hidden" alt="Podgląd wgranego zdjęcia">
    <button class="recognize_button" id="recognize_button" disabled>Rozpoznaj</button> 
  </section>

</main>

<footer>
  <div class="footer_bar">
    <p>Projekt inżynierski: rozpoznawanie ras kotów z wykorzystaniem XAI</p>
  </div>
</footer>


<script src="js/menu.js"></script>
<script src="js/rozpoznawanie.js"></script>
</body>
</html>
